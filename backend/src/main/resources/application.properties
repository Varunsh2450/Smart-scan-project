server.port=8080

# ML Service URL
ew.ml-service.url=http://localhost:5000

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:ewsimdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# EW Simulation Defaults
ew.simulation.default-bands=20
ew.simulation.default-tick-ms=500
